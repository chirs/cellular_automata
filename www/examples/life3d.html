<!DOCTYPE html>
<html lang="en">
<head>
  <title>3D Life</title>

  <meta charset="utf-8">
  <meta name="description" content="3D cellular automata">

  <link rel="stylesheet" type="text/css" href="/css/style.css">

  <script type="module">
    import { Board, neighborhoods, rules, makeLifeFamilyRule } from '/js/automata.js';
    import { Drawer3d } from '/js/draw.js';
    import { setupPanel, bindKeys, bindSpeed, setPlayButton } from '/js/ui.js';

    var canvas = document.getElementById("board3d");
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    var context = canvas.getContext("2d");

    var SIZE = 20;
    // Cube half-width in px: the domain's isometric footprint is roughly
    // 2 * SIZE cube widths across, so fit that to the smaller viewport side.
    var CUBE = Math.max(6, Math.floor(Math.min(canvas.width, canvas.height) / (2.6 * SIZE)));

    var randomBlob = function(radius, fill){
      var points = [];
      for (var x=-radius; x <= radius; x++){
        for (var y=-radius; y <= radius; y++){
          for (var z=-radius; z <= radius; z++){
            if (Math.random() < fill){ points.push([x, y, z]); }
          }
        }
      }
      return points;
    };

    // Offsets covering every cell exactly once (-SIZE/2 .. SIZE/2-1).
    var fullSoup = function(fill){
      var points = [];
      for (var x=-SIZE/2; x < SIZE/2; x++){
        for (var y=-SIZE/2; y < SIZE/2; y++){
          for (var z=-SIZE/2; z < SIZE/2; z++){
            if (Math.random() < fill){ points.push([x, y, z]); }
          }
        }
      }
      return points;
    };

    // The Bays rules die or explode from full-grid soup, so they seed from a
    // small center blob; clouds erodes away from anything less than a
    // boundaryless soup, so it gets the whole grid at 50%. The Bays rules are
    // transient by nature (a burst of structure, then death); b67s567 and
    // b45s5 sustain thousands of active cells indefinitely.
    var ruleSpecs = {
      "4555": { rule: rules.bays4555, color: "#4a90d9", seed: () => randomBlob(3, 0.4) },
      "5766": { rule: rules.bays5766, color: "#5cb85c", seed: () => randomBlob(3, 0.4) },
      "clouds": { rule: rules.clouds, color: "#9370db", seed: () => fullSoup(0.5) },
      "b67s567": { rule: makeLifeFamilyRule([6,7], [5,6,7]), color: "#e0a030", seed: () => randomBlob(3, 0.4) },
      "b45s5": { rule: makeLifeFamilyRule([4,5], [5]), color: "#d05050", seed: () => randomBlob(3, 0.4) },
    };

    var board = new Board([SIZE, SIZE, SIZE], 2, neighborhoods.moore3d, false);
    var drawer = new Drawer3d(context, board, CUBE, 6);

    var setRule = function(name){
      var spec = ruleSpecs[name];
      board.setRule(spec.rule).setStartPattern(spec.seed());
      board.colorMap = ["#fff", spec.color];
      drawer.faceColors = drawer.makeFaceColors();
      document.querySelectorAll('#rules li').forEach(li => li.classList.toggle('active', li.firstElementChild.id === name));
    };

    document.querySelectorAll('#rules a').forEach(a =>
      a.addEventListener('click', () => setRule(a.id)));

    var togglePlay = function(){
      drawer.running = !drawer.running;
      setPlayButton(drawer.running);
    };
    var step = function(){
      if (drawer.running) { togglePlay(); }
      board.next();
    };
    var reset = () => board.reset();

    document.getElementById("play").addEventListener('click', togglePlay);
    document.getElementById("forward").addEventListener('click', step);
    document.getElementById("reset").addEventListener('click', reset);
    bindSpeed(v => drawer.setRate(v));
    bindKeys({ ' ': togglePlay, n: step, ArrowRight: step, r: reset });
    setupPanel();

    setRule("4555");
    drawer.running = true;
    setPlayButton(true);
    drawer.draw3dBoard();
  </script>

  <style>
    #board3d { touch-action: none; cursor: grab; }
    #board3d:active { cursor: grabbing; }
  </style>

</head>


<body class="home">

<canvas id="board3d"></canvas>

<div id="menu">

  <header>
    <h1>3d life</h1>
    <button id="collapse" title="minimize">&ndash;</button>
  </header>

  <div class="toggled">

    <p class="tagline">life on a 20&times;20&times;20 torus with 26 neighbors. drag to rotate.</p>

    <div id="controls">
      <button id="play" class="primary" title="space">Play</button>
      <div class="secondary">
        <button id="forward" title="n or &rarr;">Step</button>
        <button id="reset" title="r">Reset</button>
      </div>
      <label id="speed-row">speed
        <input id="speed" type="range" min="1" max="30" value="6">
        <span id="speed-value">6/s</span>
      </label>
    </div>

    <h2>rules</h2>
    <ul id="rules">
      <li><a id="4555">bays 4555 (b5/s45)</a></li>
      <li><a id="5766">bays 5766 (b6/s567)</a></li>
      <li><a id="clouds">clouds</a></li>
      <li><a id="b67s567">b67/s567</a></li>
      <li><a id="b45s5">b45/s5</a></li>
    </ul>

    <footer>
      <p class="keys">space play &middot; n step &middot; r reset</p>
      <a href="/">&larr; dashboard</a> &middot; <a href="ant.html">ant</a> &middot; <a href="elementary.html">elementary</a>
    </footer>
  </div>

</div>

</body>
</html>
